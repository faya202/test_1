<!doctype html>
<html>
<head>
  <title>My First Website</title>
  <style>
    body {
      background-color: #eaf4ff;
      color: #1f2937;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 60px 20px;
    }

    .card {
      background: white;
      max-width: 600px;
      margin: auto;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    h1 {
      color: #2563eb;
      font-size: 42px;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome to My Website</h1>
    <p>Hello! I made this website using GitHub Pages.</p>
    <p>I am learning how to build websites.</p>
    <a href="https://github.com/faya202/test_1">View my GitHub project</a>
  </main>
</body>
</html>
